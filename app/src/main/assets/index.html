<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سالم بلاي TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<script src="hls.min.js"></script>
<style>
/* Layout: TV 10-foot UI — top bar, full-height screens, 3-column live view (groups | channels | preview) */
:root{
  --bg:#07121c; --panel:#0e2131; --panel2:#14304a; --line:#1f4562;
  --fg:#e8f1f7; --mute:#8aa6bb; --accent:#f2b544; --accent2:#ffcf73; --danger:#ff6b6b;
  --r:#e53935; --g:#43a047; --b:#1e63d8; --y:#fdd835;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:clamp(14px,1.25vw,22px);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(242,181,68,.10),transparent 60%),
             radial-gradient(900px 600px at 0% 110%,rgba(30,99,216,.18),transparent 60%);}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{position:relative;height:100%;display:flex;flex-direction:column;padding:2.2vh 2.5vw}
.top{display:flex;align-items:center;gap:1.5vw;min-height:7vh}
.logo{display:flex;align-items:center;gap:.6em;font-family:var(--display);font-weight:700;font-size:1.35em}
.logo i{width:2.1em;height:2.1em;border-radius:.6em;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#d9822b);color:#1a1205;font-style:normal;font-size:.8em}
.title{flex:1;text-align:center;font-family:var(--display);font-size:1.15em;color:var(--fg)}
.clock{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:1.3em;direction:ltr}
.screen{flex:1;min-height:0;display:none;padding-top:2vh}
.screen.on{display:flex;flex-direction:column}
.f{outline:none;transition:transform .12s, box-shadow .12s, background .12s}
.f:focus,.f.focus{box-shadow:0 0 0 .18em var(--accent),0 .6em 1.6em rgba(0,0,0,.45);background:var(--panel2)}
.btn{border:0;background:var(--panel);border-radius:.7em;padding:.75em 1.3em;cursor:pointer;display:inline-flex;align-items:center;gap:.5em}
.btn.pri{background:var(--accent);color:#1a1205;font-weight:600}
.btn.pri:focus{background:var(--accent2)}
.hint{display:flex;gap:1.6em;flex-wrap:wrap;color:var(--mute);font-size:.85em;padding-top:1.4vh;align-items:center}
.hint b{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;vertical-align:-.2em;margin-inline-end:.35em}

/* home */
.tiles{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;align-items:center;padding:4vh 4vw}
.tile{height:48vh;border:0;border-radius:1.2em;background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;cursor:pointer;font-family:var(--display);font-size:1.25em}
.tile svg{width:4.2em;height:4.2em;stroke:var(--accent);fill:none;stroke-width:1.6}
.tile small{font-family:var(--body);color:var(--mute);font-size:.65em}
.tile:focus{transform:scale(1.05)}
.homebar{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
.meta{color:var(--mute);text-align:center;font-size:.85em;padding-top:1.5vh}

/* live */
.live{flex:1;min-height:0;display:grid;grid-template-columns:22% 34% 1fr;gap:1.2vw}
.col{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.6vh;padding:.3em;scrollbar-width:none}
.col::-webkit-scrollbar{display:none}
.row{border:0;border-radius:.6em;background:var(--panel);padding:.7em .9em;display:flex;align-items:center;gap:.7em;text-align:start;cursor:pointer;width:100%;flex-shrink:0}
.row .n{color:var(--accent);font-variant-numeric:tabular-nums;min-width:2.4em;font-size:.85em}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row img,.row .ph{width:2.2em;height:1.6em;object-fit:contain;border-radius:.25em;background:#0a1824;flex-shrink:0}
.row .fav{color:var(--accent)}
.row.sel{background:var(--panel2);box-shadow:inset .2em 0 0 var(--accent)}
.prev{display:flex;flex-direction:column;gap:1.2vh;min-width:0}
.vbox{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:.8em;overflow:hidden}
.vbox video{width:100%;height:100%;display:block;background:#000}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:1em;font-size:.9em}
.info{background:var(--panel);border-radius:.8em;padding:1em 1.2em}
.info h3{margin:0 0 .3em;font-family:var(--display);font-size:1.1em}
.info p{margin:0;color:var(--mute);font-size:.85em;word-break:break-all}
.search{border:0;border-radius:.6em;background:var(--panel);padding:.7em .9em;width:100%}

/* grid (VOD) */
.vodwrap{flex:1;min-height:0;display:grid;grid-template-columns:22% 1fr;gap:1.2vw}
.grid{min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:1.2vw;align-content:start;padding:.4em;scrollbar-width:none}
.card{border:0;border-radius:.8em;background:var(--panel);padding:0;cursor:pointer;overflow:hidden;text-align:start}
.card .pst{aspect-ratio:2/3;background:#0a1824 center/cover no-repeat;display:grid;place-items:center;color:var(--line);font-family:var(--display);font-size:2em}
.card .ct{padding:.5em .7em;font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:focus{transform:scale(1.06)}

/* lists / forms */
.panel{max-width:62em;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:1.2vh;overflow:auto;padding:.4em}
.pl{display:grid;grid-template-columns:repeat(2,1fr);gap:1vw}
.pl .row{padding:1em 1.2em}
.pl .row.act{box-shadow:inset .25em 0 0 var(--accent)}
.form{background:var(--panel);border-radius:1em;padding:1.4em;display:flex;flex-direction:column;gap:1em}
.form h2{margin:0;font-family:var(--display);font-size:1.2em}
.form label{display:flex;flex-direction:column;gap:.35em;color:var(--mute);font-size:.85em}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:.6em;padding:.7em .9em;color:var(--fg);font:inherit;direction:ltr;text-align:left}
.form textarea{min-height:6em;resize:vertical}
.seg{display:flex;gap:.6em;flex-wrap:wrap}
.seg .btn.on{background:var(--panel2);box-shadow:inset 0 -.18em 0 var(--accent)}
.err{color:var(--danger);font-size:.9em;min-height:1.2em}
.set .row{justify-content:space-between}
.set .row span:last-child{color:var(--accent)}

/* fullscreen player */
.fs{position:fixed;inset:0;background:#000;z-index:50;display:none}
.fs.on{display:block}
.fs video{width:100%;height:100%;background:#000}
.osd{position:absolute;inset-inline:3vw;bottom:4vh;background:rgba(7,18,28,.85);border-radius:1em;padding:1em 1.4em;display:flex;align-items:center;gap:1.2em;transition:opacity .3s}
.osd.hide{opacity:0}
.osd .n{font-family:var(--display);color:var(--accent);font-size:1.6em;font-variant-numeric:tabular-nums}
.osd h3{margin:0;font-family:var(--display)}
.osd p{margin:.2em 0 0;color:var(--mute);font-size:.85em}
.fsmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none;text-align:center;padding:2em}
.toast{position:fixed;bottom:5vh;left:50%;transform:translateX(-50%);background:var(--panel2);padding:.8em 1.4em;border-radius:.8em;z-index:60;box-shadow:0 .6em 2em rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--mute);padding:2em;text-align:center;line-height:1.8}

@media (max-width:820px){
  body{overflow:auto;font-size:15px}
  .app{height:auto;min-height:100%;padding-inline:16px}
  .tiles{grid-template-columns:repeat(2,1fr);padding:2vh 0}
  .tile{height:24vh}
  .live,.vodwrap{grid-template-columns:1fr;grid-auto-rows:auto}
  .col{max-height:38vh}
  .pl{grid-template-columns:1fr}
  .screen{min-height:70vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" dir="rtl">
  <header class="top">
    <div class="logo"><i>▶</i><span>سالم بلاي</span></div>
    <div class="title" id="ttl">الرئيسية</div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <!-- HOME -->
  <section class="screen on" id="s-home">
    <div class="tiles">
      <button class="tile f" data-go="live"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><circle cx="19" cy="4" r="1.6" fill="currentColor"/></svg>قنوات مباشرة<small id="c-live">—</small></button>
      <button class="tile f" data-go="movies"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>أفلام<small id="c-movies">—</small></button>
      <button class="tile f" data-go="series"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M7 2l5 4 5-4M10 10l5 3-5 3z"/></svg>مسلسلات<small id="c-series">—</small></button>
      <button class="tile f" data-go="recent"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>شوهد مؤخراً<small id="c-recent">—</small></button>
    </div>
    <div class="homebar">
      <button class="btn f" data-go="playlists">📋 قوائم التشغيل</button>
      <button class="btn f" data-go="favs">★ المفضلة</button>
      <button class="btn f" data-go="settings">⚙ الإعدادات</button>
      <button class="btn f" id="reload">⟳ تحديث القائمة</button>
    </div>
    <div class="meta" id="meta">لا توجد قائمة تشغيل بعد</div>
  </section>

  <!-- LIVE -->
  <section class="screen" id="s-live">
    <div class="live">
      <div class="col" id="groups"></div>
      <div class="col" id="chans"></div>
      <div class="prev">
        <div class="vbox"><video id="pv" muted playsinline></video><div class="vmsg" id="pvmsg">اختر قناة للمعاينة</div></div>
        <div class="info"><h3 id="pvname">—</h3><p id="pvgrp">اضغط OK مرتين للتشغيل بملء الشاشة</p></div>
      </div>
    </div>
    <div class="hint"><span>⟵ عودة</span><span>OK تشغيل</span><span><b style="background:var(--r)"></b>مفضلة</span><span><b style="background:var(--g)"></b>بحث</span><span><b style="background:var(--y)"></b>كل القنوات</span></div>
  </section>

  <!-- VOD GRID -->
  <section class="screen" id="s-vod">
    <div class="vodwrap">
      <div class="col" id="vgroups"></div>
      <div class="grid" id="vgrid"></div>
    </div>
    <div class="hint"><span>⟵ عودة</span><span>OK تشغيل</span><span><b style="background:var(--r)"></b>مفضلة</span><span><b style="background:var(--g)"></b>بحث</span></div>
  </section>

  <!-- SERIES EPISODES -->
  <section class="screen" id="s-eps">
    <div class="vodwrap">
      <div class="col" id="seasons"></div>
      <div class="col" id="eps"></div>
    </div>
  </section>

  <!-- PLAYLISTS -->
  <section class="screen" id="s-playlists">
    <div class="panel">
      <div class="pl" id="pllist"></div>
      <div class="form">
        <h2>إضافة قائمة تشغيل</h2>
        <div class="seg" id="ptype">
          <button class="btn f on" data-t="m3u">رابط M3U</button>
          <button class="btn f" data-t="xtream">Xtream Codes</button>
          <button class="btn f" data-t="file">ملف / نص</button>
        </div>
        <label>اسم القائمة<input class="f" id="pname" placeholder="مثال: البيت" style="direction:rtl;text-align:right"></label>
        <div id="f-m3u"><label>رابط القائمة<input class="f" id="purl" placeholder="http://example.com/get.php?username=...&type=m3u_plus"></label></div>
        <div id="f-xtream" hidden>
          <label>رابط السيرفر<input class="f" id="xsrv" placeholder="http://server.com:8080"></label>
          <label>اسم المستخدم<input class="f" id="xusr"></label>
          <label>كلمة المرور<input class="f" id="xpwd"></label>
        </div>
        <div id="f-file" hidden>
          <label>ارفع ملف .m3u<input class="f" type="file" id="pfile" accept=".m3u,.m3u8,.txt"></label>
          <label>أو الصق محتوى القائمة<textarea class="f" id="ptext" placeholder="#EXTM3U&#10;#EXTINF:-1 group-title=&quot;أخبار&quot;,قناة&#10;http://..."></textarea></label>
        </div>
        <div class="err" id="perr"></div>
        <div><button class="btn pri f" id="padd">إضافة وتحميل</button></div>
      </div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="s-settings">
    <div class="panel set">
      <button class="row f" id="st-time"><span>تنسيق الوقت</span><span></span></button>
      <button class="row f" id="st-preview"><span>المعاينة التلقائية للقنوات</span><span></span></button>
      <button class="row f" id="st-pin"><span>الرقابة الأبوية (إخفاء مجموعات البالغين)</span><span></span></button>
      <button class="row f" id="st-clearrecent"><span>مسح "شوهد مؤخراً"</span><span>مسح</span></button>
      <button class="row f" id="st-clearfav"><span>مسح المفضلة</span><span>مسح</span></button>
      <div class="info"><h3>معلومات</h3><p id="st-info"></p></div>
    </div>
  </section>
</div>

<div class="fs" id="fs">
  <video id="fv" playsinline></video>
  <div class="fsmsg" id="fsmsg"></div>
  <div class="osd" id="osd"><div class="n" id="osdn"></div><div><h3 id="osdt"></h3><p id="osdp"></p></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem('sp_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('sp_'+k,JSON.stringify(v))}catch(e){}}};

let playlists=store.get('playlists',[]);
let activeId=store.get('active',null);
let favs=store.get('favs',[]);
let recent=store.get('recent',[]);
let settings=Object.assign({h24:false,preview:true,adult:true},store.get('settings',{}));
let data={live:[],movies:[],series:[]}; // arrays of {name, items:[...]}
let screen='home', stack=[];
let liveState={g:0,list:[],idx:-1}, vodState={kind:'movies',g:0,list:[]};
const DEMO={id:'demo',name:'تجريبية',type:'text',text:`#EXTM3U
#EXTINF:-1 tvg-logo="" group-title="بث تجريبي",Apple Test Stream
https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8
#EXTINF:-1 group-title="بث تجريبي",Mux Test Stream
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 group-title="أفلام قصيرة",Big Buck Bunny
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8`};

/* ---------- clock ---------- */
function tick(){const d=new Date();let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0'),s=String(d.getSeconds()).padStart(2,'0');
  if(settings.h24){$('#clock').textContent=`${String(h).padStart(2,'0')}:${m}:${s}`}
  else{const ap=h>=12?'PM':'AM';h=h%12||12;$('#clock').textContent=`${String(h).padStart(2,'0')}:${m}:${s} ${ap}`}}
setInterval(tick,1000);tick();

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const adultRx=/adult|xxx|18\+|للكبار|\+18/i;

/* ---------- parsing ---------- */
function parseM3U(txt){
  const out={live:{},movies:{},series:{}};const lines=txt.split(/\r?\n/);let cur=null;
  for(const raw of lines){const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){const attr=k=>{const m=l.match(new RegExp(k+'="([^"]*)"'));return m?m[1]:''};
      cur={name:l.slice(l.lastIndexOf(',')+1).trim()||attr('tvg-name')||'بدون اسم',logo:attr('tvg-logo'),group:attr('group-title')||'عام'};}
    else if(!l.startsWith('#')&&cur){cur.url=l;
      const kind=/\/movie\//i.test(l)?'movies':/\/series\//i.test(l)?'series':'live';
      (out[kind][cur.group]??=[]).push(cur);cur=null;}}
  const toArr=o=>Object.entries(o).map(([name,items])=>({name,items}));
  return {live:toArr(out.live),movies:toArr(out.movies),series:toArr(out.series)};
}
async function getText(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

async function loadXtream(p){
  const base=p.server.replace(/\/+$/,''), q=`${base}/player_api.php?username=${encodeURIComponent(p.user)}&password=${encodeURIComponent(p.pass)}`;
  const info=await getJSON(q);
  if(!info||!info.user_info||info.user_info.auth==0)throw new Error('بيانات الدخول غير صحيحة');
  p.exp=info.user_info.exp_date?new Date(info.user_info.exp_date*1000).toLocaleDateString('ar-OM'):'غير محدد';
  const [lc,ls,vc,vs,sc,ss]=await Promise.all(['get_live_categories','get_live_streams','get_vod_categories','get_vod_streams','get_series_categories','get_series'].map(a=>getJSON(`${q}&action=${a}`).catch(()=>[])));
  const group=(cats,items,mk)=>{const m=new Map((cats||[]).map(c=>[String(c.category_id),{name:c.category_name,items:[]}]));const other={name:'أخرى',items:[]};
    (items||[]).forEach(it=>{(m.get(String(it.category_id))||other).items.push(mk(it))});return [...m.values(),other].filter(g=>g.items.length)};
  const u=encodeURIComponent(p.user),pw=encodeURIComponent(p.pass);
  return {
    live:group(lc,ls,it=>({name:it.name,logo:it.stream_icon,num:it.num,url:`${base}/live/${u}/${pw}/${it.stream_id}.m3u8`})),
    movies:group(vc,vs,it=>({name:it.name,logo:it.stream_icon,url:`${base}/movie/${u}/${pw}/${it.stream_id}.${it.container_extension||'mp4'}`})),
    series:group(sc,ss,it=>({name:it.name,logo:it.cover,seriesId:it.series_id,xt:{base,u,pw,q}})),
  };
}
async function loadPlaylist(p){
  if(p.type==='xtream')return loadXtream(p);
  const txt=p.type==='text'?p.text:await getText(p.url);
  if(!/#EXTINF/i.test(txt))throw new Error('المحتوى ليس قائمة M3U صالحة');
  return parseM3U(txt);
}
function activePl(){return playlists.find(p=>p.id===activeId)||(playlists.length?playlists[0]:DEMO)}
async function refresh(){
  const p=activePl();$('#meta').textContent='جاري تحميل '+p.name+'…';
  try{data=await loadPlaylist(p);
    if(settings.adult)for(const k of ['live','movies','series'])data[k]=data[k].filter(g=>!adultRx.test(g.name));
    let n=1;data.live.forEach(g=>g.items.forEach(c=>{c.num=c.num||n;n++}));
    updateHome(p);
  }catch(e){
    $('#meta').textContent=`تعذّر تحميل "${p.name}": ${e.message}. إذا كان الرابط يبدأ بـ http أو السيرفر يمنع الوصول من المتصفح، جرّب رفع الملف أو تشغيل التطبيق كتطبيق Android TV.`;
  }
}
const count=k=>data[k].reduce((a,g)=>a+g.items.length,0);
function updateHome(p){p=p||activePl();
  $('#c-live').textContent=count('live')+' قناة';$('#c-movies').textContent=count('movies')+' فيلم';
  $('#c-series').textContent=count('series')+' مسلسل';$('#c-recent').textContent=recent.length+' عنصر';
  $('#meta').textContent=`القائمة الحالية: ${p.name}${p.exp?' · تنتهي: '+p.exp:''}${p.id==='demo'?' · أضف قائمتك من "قوائم التشغيل"':''}`;}

/* ---------- navigation ---------- */
const titles={home:'الرئيسية',live:'قنوات تلفزيونية مباشرة',movies:'أفلام',series:'مسلسلات',recent:'شوهد مؤخراً',favs:'المفضلة',playlists:'قوائم التشغيل',settings:'الإعدادات',eps:'الحلقات'};
function show(id,push=true,title){
  if(push&&screen!==id)stack.push(screen);screen=id;
  const el=['live','favs','recent'].includes(id)?'live':['movies','series'].includes(id)?'vod':id;
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+el));
  $('#ttl').textContent=title||titles[id]||'';
  if(id!=='live'&&id!=='favs'&&id!=='recent')stopPreview();
  ({live:()=>openLive('all'),favs:()=>openLive('favs'),recent:()=>openLive('recent'),movies:()=>openVod('movies'),series:()=>openVod('series'),playlists:renderPlaylists,settings:renderSettings,home:()=>focusFirst('#s-home .tile')}[id]||(()=>{}))();
}
function back(){
  if($('#fs').classList.contains('on')){closeFs();return}
  if(stack.length)show(stack.pop(),false);
}
function focusFirst(sel){const e=$(sel);if(e)e.focus()}

/* spatial navigation */
function visibleF(){return $$('.f').filter(e=>{if($('#fs').classList.contains('on'))return false;const r=e.getBoundingClientRect();return r.width&&r.height&&e.offsetParent!==null})}
function move(dir){
  const cur=document.activeElement;const all=visibleF();
  if(!cur||!all.includes(cur)){all[0]&&all[0].focus();return}
  const a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;let best=null,bs=1e9;
  for(const e of all){if(e===cur)continue;const b=e.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2,dx=bx-ax,dy=by-ay;
    let ok=false,main=0,side=0;
    if(dir==='left'){ok=b.right<=a.left+4;main=-dx;side=Math.abs(dy)}
    if(dir==='right'){ok=b.left>=a.right-4;main=dx;side=Math.abs(dy)}
    if(dir==='up'){ok=b.bottom<=a.top+4;main=-dy;side=Math.abs(dx)}
    if(dir==='down'){ok=b.top>=a.bottom-4;main=dy;side=Math.abs(dx)}
    if(!ok)continue;
    // prefer staying in same column for up/down
    const sameCol=e.parentElement===cur.parentElement?0:400;
    const score=main+side*2+((dir==='up'||dir==='down')?sameCol:0);
    if(score<bs){bs=score;best=e}}
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}
}

/* ---------- live ---------- */
function liveGroups(mode){
  if(mode==='favs')return [{name:'المفضلة',items:favs}];
  if(mode==='recent')return [{name:'شوهد مؤخراً',items:recent}];
  return [{name:'كل القنوات',items:data.live.flatMap(g=>g.items)},{name:'★ المفضلة',items:favs.filter(f=>!f.kind||f.kind==='live')},...data.live];
}
let liveMode='all';
function openLive(mode){liveMode=mode;const gs=liveGroups(mode);
  $('#groups').innerHTML=gs.map((g,i)=>`<button class="row f" data-g="${i}"><span class="nm">${esc(g.name)}</span><span class="n">${g.items.length}</span></button>`).join('');
  selectGroup(mode==='all'&&gs.length>2?2:0,false);
  const first=$('#chans .row')||$('#groups .row');first&&first.focus();
}
function selectGroup(i,focus=true){const gs=liveGroups(liveMode);liveState.g=i;liveState.list=gs[i]?gs[i].items:[];
  $$('#groups .row').forEach((r,j)=>r.classList.toggle('sel',j===i));renderChans(liveState.list);
  if(focus){const f=$('#chans .row');f&&f.focus()}}
function isFav(c){return favs.some(f=>f.url===c.url)}
function renderChans(list){
  $('#chans').innerHTML=list.length?list.map((c,i)=>`<button class="row f" data-c="${i}"><span class="n">${esc(c.num||i+1)}</span>${c.logo?`<img src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<span class="ph"></span>'}<span class="nm">${esc(c.name)}</span>${isFav(c)?'<span class="fav">♥</span>':''}</button>`).join('')
  :'<div class="empty">لا توجد قنوات هنا</div>';
}
let pvHls=null,pvTimer=null;
function fixUrl(url){
  // Xtream-style live links without extension (or .ts) → HLS version that the player can handle
  const m=url.match(/^(https?:\/\/[^\/]+)\/(?:live\/)?([^\/]+)\/([^\/]+)\/(\d+)(?:\.ts)?$/i);
  return m?`${m[1]}/live/${m[2]}/${m[3]}/${m[4]}.m3u8`:url;
}
function attach(video,url,hlsRef){
  url=fixUrl(url);
  if(hlsRef.h){hlsRef.h.destroy();hlsRef.h=null}
  video.removeAttribute('src');
  if(/\.m3u8(\?|$)/i.test(url)&&window.Hls&&Hls.isSupported()){const h=new Hls({maxBufferLength:20});h.loadSource(url);h.attachMedia(video);hlsRef.h=h;
    h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)video.dispatchEvent(new Event('error'))});}
  else video.src=url;
  return video.play().catch(()=>{});
}
const pvRef={h:null},fsRef={h:null};
function preview(c){
  $('#pvname').textContent=c.name;$('#pvgrp').textContent=(c.group||'')+' · اضغط OK للتشغيل بملء الشاشة';
  if(!settings.preview){$('#pvmsg').textContent='المعاينة متوقفة من الإعدادات';return}
  clearTimeout(pvTimer);$('#pvmsg').textContent='جاري التحميل…';$('#pvmsg').hidden=false;
  pvTimer=setTimeout(()=>attach($('#pv'),c.url,pvRef),450);
}
$('#pv').addEventListener('playing',()=>$('#pvmsg').hidden=true);
$('#pv').addEventListener('error',()=>{$('#pvmsg').hidden=false;$('#pvmsg').textContent='تعذّر تشغيل القناة (الرابط متوقف أو يحتاج تطبيق Android TV)'});
function stopPreview(){clearTimeout(pvTimer);if(pvRef.h){pvRef.h.destroy();pvRef.h=null}const v=$('#pv');v.pause();v.removeAttribute('src');v.load()}

/* ---------- vod ---------- */
function openVod(kind){vodState.kind=kind;const gs=[{name:'الكل',items:data[kind].flatMap(g=>g.items)},...data[kind]];vodState.groups=gs;
  $('#vgroups').innerHTML=gs.map((g,i)=>`<button class="row f" data-vg="${i}"><span class="nm">${esc(g.name)}</span><span class="n">${g.items.length}</span></button>`).join('');
  selectVod(0,false);focusFirst('#vgrid .card')||focusFirst('#vgroups .row');if(!$('#vgrid .card'))focusFirst('#vgroups .row');}
function selectVod(i,focus=true){vodState.g=i;vodState.list=vodState.groups[i].items;
  $$('#vgroups .row').forEach((r,j)=>r.classList.toggle('sel',j===i));renderGrid(vodState.list);if(focus)focusFirst('#vgrid .card')}
function renderGrid(list){const max=300;
  $('#vgrid').innerHTML=list.length?list.slice(0,max).map((m,i)=>`<button class="card f" data-v="${i}"><div class="pst" ${m.logo?`style="background-image:url('${esc(m.logo)}')"`:''}>${m.logo?'':'▶'}</div><div class="ct">${isFav(m)?'♥ ':''}${esc(m.name)}</div></button>`).join('')+(list.length>max?`<div class="empty">يعرض أول ${max} — استخدم البحث (الزر الأخضر)</div>`:'')
  :'<div class="empty">لا يوجد محتوى في هذا القسم.<br>القوائم بصيغة Xtream تعرض الأفلام والمسلسلات تلقائياً.</div>';}
async function openSeries(s){
  if(!s.xt){playFs(s,[s],0);return}
  show('eps',true,s.name);$('#seasons').innerHTML='<div class="empty">جاري التحميل…</div>';$('#eps').innerHTML='';
  try{const d=await getJSON(`${s.xt.q}&action=get_series_info&series_id=${s.seriesId}`);const eps=d.episodes||{};
    const keys=Object.keys(eps);
    $('#seasons').innerHTML=keys.map(k=>`<button class="row f" data-sea="${esc(k)}"><span class="nm">الموسم ${esc(k)}</span><span class="n">${eps[k].length}</span></button>`).join('')||'<div class="empty">لا توجد حلقات</div>';
    const showSea=k=>{$$('#seasons .row').forEach(r=>r.classList.toggle('sel',r.dataset.sea===k));
      const list=eps[k].map(e=>({name:`${s.name} · ح${e.episode_num} ${e.title&&e.title!==s.name?'· '+e.title:''}`,logo:s.logo,url:`${s.xt.base}/series/${s.xt.u}/${s.xt.pw}/${e.id}.${e.container_extension||'mp4'}`,kind:'vod'}));
      $('#eps')._list=list;
      $('#eps').innerHTML=list.map((e,i)=>`<button class="row f" data-ep="${i}"><span class="n">${i+1}</span><span class="nm">${esc(e.name)}</span></button>`).join('');};
    $('#seasons')._show=showSea;if(keys[0]){showSea(keys[0]);focusFirst('#eps .row')}
  }catch(e){$('#seasons').innerHTML=`<div class="empty">تعذّر تحميل الحلقات: ${esc(e.message)}</div>`}
}

/* ---------- fullscreen player ---------- */
let fsList=[],fsIdx=0,osdT=null;
function playFs(item,list,idx){fsList=list;fsIdx=idx;stopPreview();$('#fs').classList.add('on');
  try{const fe=document.documentElement;fe.requestFullscreen&&fe.requestFullscreen().catch(()=>{})}catch(e){}
  startFs();}
function startFs(){const c=fsList[fsIdx];if(!c)return;
  $('#fsmsg').textContent='جاري التحميل…';$('#osdn').textContent=c.num||'';$('#osdt').textContent=c.name;$('#osdp').textContent=(c.group||'')+'  ·  ▲▼ تغيير القناة  ·  ⟵ رجوع';
  showOsd();attach($('#fv'),c.url,fsRef);
  recent=[c,...recent.filter(r=>r.url!==c.url)].slice(0,40);store.set('recent',recent);}
function showOsd(){const o=$('#osd');o.classList.remove('hide');clearTimeout(osdT);osdT=setTimeout(()=>o.classList.add('hide'),4000)}
$('#fv').addEventListener('playing',()=>$('#fsmsg').textContent='');
$('#fv').addEventListener('error',()=>$('#fsmsg').textContent='تعذّر التشغيل. الرابط قد يكون متوقفاً، أو يحتاج تشغيله من تطبيق Android TV.');
function closeFs(){$('#fs').classList.remove('on');if(fsRef.h){fsRef.h.destroy();fsRef.h=null}const v=$('#fv');v.pause();v.removeAttribute('src');v.load();
  try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
  const cur=$('#chans .row[data-c="'+fsIdx+'"]');if(screen==='live'&&cur)cur.focus();updateHome();}
function zap(d){if(!fsList.length)return;fsIdx=(fsIdx+d+fsList.length)%fsList.length;startFs()}

/* ---------- favourites ---------- */
function toggleFav(c,kind){if(!c)return;if(isFav(c)){favs=favs.filter(f=>f.url!==c.url);toast('أزيلت من المفضلة')}else{favs.push({...c,kind});toast('أضيفت إلى المفضلة ♥')}store.set('favs',favs)}

/* ---------- search ---------- */
function openSearch(){
  const inLive=screen==='live'||screen==='favs'||screen==='recent';const box=inLive?$('#chans'):$('#vgrid');
  if(box.querySelector('.search'))return box.querySelector('.search').focus();
  const inp=document.createElement('input');inp.className='search f';inp.placeholder='ابحث بالاسم…';inp.id='q-'+screen;
  box.prepend(inp);inp.focus();
  inp.addEventListener('input',()=>{const q=inp.value.trim().toLowerCase();
    const src=inLive?liveGroups(liveMode)[0].items:vodState.groups[0].items;
    const res=q?src.filter(c=>c.name.toLowerCase().includes(q)):(inLive?liveState.list:vodState.list);
    if(inLive){liveState.list=res;renderChans(res)}else{vodState.list=res;renderGrid(res)}
    box.prepend(inp);inp.focus();});
}

/* ---------- playlists ---------- */
let ptype='m3u';
function renderPlaylists(){
  $('#pllist').innerHTML=playlists.map(p=>`<button class="row f ${p.id===activePl().id?'act':''}" data-pl="${p.id}"><span class="nm">📄 ${esc(p.name)}</span><span class="n">${p.type==='xtream'?'Xtream':'M3U'}</span></button>`).join('')
   +`<button class="row f" data-pl="demo"><span class="nm">▶ القائمة التجريبية</span></button>`
   +(playlists.length?`<button class="row f" id="pldel"><span class="nm">🗑 حذف القائمة الحالية</span></button>`:'');
  focusFirst('#pllist .row');
}
$('#ptype').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;ptype=b.dataset.t;
  $$('#ptype .btn').forEach(x=>x.classList.toggle('on',x===b));['m3u','xtream','file'].forEach(t=>$('#f-'+t).hidden=t!==ptype)});
$('#pfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#ptext').value=r.result;if(!$('#pname').value)$('#pname').value=f.name.replace(/\.\w+$/,'')};r.readAsText(f)});
$('#padd').addEventListener('click',async()=>{
  const name=$('#pname').value.trim()||'قائمة '+(playlists.length+1);let p={id:Date.now().toString(36),name,type:ptype==='file'?'text':ptype};
  if(ptype==='m3u'){p.url=$('#purl').value.trim();if(!/^https?:\/\//.test(p.url))return $('#perr').textContent='اكتب رابطاً يبدأ بـ http أو https'}
  if(ptype==='xtream'){p.server=$('#xsrv').value.trim();p.user=$('#xusr').value.trim();p.pass=$('#xpwd').value.trim();if(!p.server||!p.user||!p.pass)return $('#perr').textContent='أكمل السيرفر واسم المستخدم وكلمة المرور'}
  if(ptype==='file'){p.text=$('#ptext').value;if(!/#EXTINF/i.test(p.text))return $('#perr').textContent='الصق محتوى M3U صالحاً أو ارفع ملفاً'}
  $('#perr').textContent='جاري التحقق…';
  try{await loadPlaylist(p);}catch(e){$('#perr').textContent='تمت الإضافة لكن التحميل فشل: '+e.message}
  playlists.push(p);activeId=p.id;store.set('playlists',playlists);store.set('active',activeId);
  ['#pname','#purl','#xsrv','#xusr','#xpwd','#ptext'].forEach(s=>$(s).value='');
  if($('#perr').textContent==='جاري التحقق…')$('#perr').textContent='';
  toast('أضيفت "'+name+'"');await refresh();renderPlaylists();
});

/* ---------- settings ---------- */
function renderSettings(){
  $('#st-time span:last-child').textContent=settings.h24?'24 ساعة':'12 ساعة';
  $('#st-preview span:last-child').textContent=settings.preview?'مفعّلة':'متوقفة';
  $('#st-pin span:last-child').textContent=settings.adult?'مفعّلة':'متوقفة';
  $('#st-info').textContent=`القوائم: ${playlists.length} · المفضلة: ${favs.length} · القنوات المحمّلة: ${count('live')} · الأفلام: ${count('movies')} · المسلسلات: ${count('series')}`;
  focusFirst('#s-settings .row');}
function saveSet(){store.set('settings',settings);renderSettings();tick()}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.go)return show(t.dataset.go);
  if(t.id==='reload'){refresh().then(()=>toast('تم التحديث'));return}
  if(t.dataset.g!==undefined)return selectGroup(+t.dataset.g);
  if(t.dataset.c!==undefined){const i=+t.dataset.c,c=liveState.list[i];
    if(liveState.idx===i&&settings.preview)return playFs(c,liveState.list,i);
    liveState.idx=i;preview(c);if(!settings.preview)playFs(c,liveState.list,i);return}
  if(t.dataset.vg!==undefined)return selectVod(+t.dataset.vg);
  if(t.dataset.v!==undefined){const m=vodState.list[+t.dataset.v];return vodState.kind==='series'?openSeries(m):playFs(m,vodState.list,+t.dataset.v)}
  if(t.dataset.sea!==undefined){$('#seasons')._show(t.dataset.sea);return}
  if(t.dataset.ep!==undefined){const l=$('#eps')._list;return playFs(l[+t.dataset.ep],l,+t.dataset.ep)}
  if(t.dataset.pl){if(t.dataset.pl==='demo'){activeId=null;playlists.length&&toast('لاستخدام التجريبية احذف قوائمك أو اخترها')}else activeId=t.dataset.pl;
    store.set('active',activeId);refresh().then(renderPlaylists);return}
  if(t.id==='pldel'){const p=activePl();playlists=playlists.filter(x=>x.id!==p.id);activeId=playlists[0]?.id||null;store.set('playlists',playlists);store.set('active',activeId);toast('حُذفت "'+p.name+'"');refresh().then(renderPlaylists);return}
  if(t.id==='st-time'){settings.h24=!settings.h24;return saveSet()}
  if(t.id==='st-preview'){settings.preview=!settings.preview;return saveSet()}
  if(t.id==='st-pin'){settings.adult=!settings.adult;saveSet();refresh();return}
  if(t.id==='st-clearrecent'){recent=[];store.set('recent',recent);toast('تم المسح');updateHome();return}
  if(t.id==='st-clearfav'){favs=[];store.set('favs',favs);toast('تم المسح');return}
});
// focus on channel = live preview after short pause
document.addEventListener('focusin',e=>{const t=e.target;
  if(t.dataset&&t.dataset.c!==undefined&&settings.preview){const i=+t.dataset.c;liveState.idx=i;preview(liveState.list[i])}});
document.addEventListener('dblclick',e=>{const t=e.target.closest('[data-c]');if(t){const i=+t.dataset.c;playFs(liveState.list[i],liveState.list,i)}});
$('#fs').addEventListener('click',()=>showOsd());

/* ---------- remote keys ---------- */
const K={37:'left',38:'up',39:'right',40:'down',13:'ok',8:'back',27:'back',10009:'back',461:'back',403:'red',404:'green',405:'yellow',406:'blue',427:'chup',428:'chdown',33:'chup',34:'chdown'};
document.addEventListener('keydown',e=>{
  const k=K[e.keyCode]||({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'ok',Escape:'back',GoBack:'back',BrowserBack:'back',ColorF0Red:'red',ColorF1Green:'green',ColorF2Yellow:'yellow',ColorF3Blue:'blue',ChannelUp:'chup',ChannelDown:'chdown'})[e.key];
  if(!k)return;
  const typing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(typing&&(k==='left'||k==='right'||(k==='back'&&e.keyCode===8)))return;
  if($('#fs').classList.contains('on')){e.preventDefault();
    if(k==='back')closeFs();else if(k==='up'||k==='chup')zap(-1);else if(k==='down'||k==='chdown')zap(1);else showOsd();
    if(k==='red')toggleFav(fsList[fsIdx],'live');return}
  if(k==='back'){e.preventDefault();return back()}
  if(['left','right','up','down'].includes(k)){e.preventDefault();return move(k)}
  if(k==='ok'&&typing&&document.activeElement.tagName==='INPUT'){e.preventDefault();move('down');return}
  if(k==='red'){const a=document.activeElement;
    if(a.dataset.c!==undefined){toggleFav(liveState.list[+a.dataset.c],'live');const i=a.dataset.c;renderChans(liveState.list);focusFirst(`#chans [data-c="${i}"]`)}
    else if(a.dataset.v!==undefined){toggleFav(vodState.list[+a.dataset.v],vodState.kind);const i=a.dataset.v;renderGrid(vodState.list);focusFirst(`#vgrid [data-v="${i}"]`)}
    return}
  if(k==='green'&&['live','favs','recent','movies','series'].includes(screen))return openSearch();
  if(k==='yellow'&&screen==='live')return selectGroup(0);
  if((k==='chup'||k==='chdown')&&screen==='live'){move(k==='chup'?'up':'down')}
});

// Android TV back button hook: returns true if handled inside the app
window.spBack=()=>{if($('#fs').classList.contains('on')){closeFs();return true}if(stack.length){back();return true}return false};

refresh().then(()=>focusFirst('#s-home .tile'));
})();
</script>
