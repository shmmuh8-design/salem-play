<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سالم بلاي TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<script src="hls.min.js"></script>
<style>
/* Layout: TV 10-foot UI — top bar, full-height screens, 3-column live view, 4x4 favourites grid, modal menus */
:root{
  --h:212;
  --bg:hsl(var(--h) 60% 6%); --panel:hsl(var(--h) 45% 13% / .88); --panel2:hsl(var(--h) 50% 24% / .94); --line:hsl(var(--h) 40% 28%);
  --fg:#e8f1f7; --mute:#9db3c4; --accent:#f2b544; --accent2:#ffcf73; --danger:#ff6b6b;
  --sheet:hsl(var(--h) 62% 48%); --sheet2:hsl(var(--h) 75% 58%);
  --bgcss:hsl(var(--h) 60% 6%);
  --r:#e53935; --g:#43a047; --b:#1e63d8; --y:#fdd835;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --fs:1;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:calc(clamp(14px,1.25vw,22px) * var(--fs));overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:var(--bgcss)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:2.2vh 2.5vw}
.top{display:flex;align-items:center;gap:1.5vw;min-height:7vh}
.logo{display:flex;align-items:center;gap:.6em;font-family:var(--display);font-weight:700;font-size:1.35em}
.logo i{width:2.1em;height:2.1em;border-radius:.6em;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#d9822b);color:#1a1205;font-style:normal;font-size:.8em}
.title{flex:1;text-align:center;font-family:var(--display);font-size:1.15em}
.clock{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:1.3em;direction:ltr}
.screen{flex:1;min-height:0;display:none;padding-top:2vh}
.screen.on{display:flex;flex-direction:column}
.f{outline:none;transition:transform .12s, box-shadow .12s, background .12s}
.f:focus{box-shadow:0 0 0 .18em var(--accent),0 .6em 1.6em rgba(0,0,0,.45);background:var(--panel2)}
.btn{border:0;background:var(--panel);border-radius:.7em;padding:.75em 1.3em;cursor:pointer;display:inline-flex;align-items:center;gap:.5em}
.btn.pri{background:var(--accent);color:#1a1205;font-weight:600}
.btn.pri:focus{background:var(--accent2)}
.hint{display:flex;gap:1.6em;flex-wrap:wrap;color:var(--mute);font-size:.85em;padding-top:1.4vh;align-items:center}
.hint b{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;vertical-align:-.2em;margin-inline-end:.35em}
.hint kbd{font-family:inherit;background:var(--panel);border-radius:.4em;padding:.1em .5em;color:var(--fg)}

/* home */
.tiles{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;align-items:center;padding:4vh 4vw}
.tile{height:48vh;border:0;border-radius:1.2em;background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;cursor:pointer;font-family:var(--display);font-size:1.25em}
.tile svg{width:4.2em;height:4.2em;stroke:var(--accent);fill:none;stroke-width:1.6}
.tile small{font-family:var(--body);color:var(--mute);font-size:.65em}
.tile:focus{transform:scale(1.05)}
.homebar{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
.meta{color:var(--mute);text-align:center;font-size:.85em;padding-top:1.5vh}

/* live */
.live{flex:1;min-height:0;display:grid;grid-template-columns:22% 34% 1fr;gap:1.2vw}
.col{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.6vh;padding:.3em;scrollbar-width:none}
.col::-webkit-scrollbar,.grid::-webkit-scrollbar,.favgrid::-webkit-scrollbar{display:none}
.row{border:0;border-radius:.6em;background:var(--panel);padding:.7em .9em;display:flex;align-items:center;gap:.7em;text-align:start;cursor:pointer;width:100%;flex-shrink:0}
.row .n{color:var(--accent);font-variant-numeric:tabular-nums;min-width:2.4em;font-size:.85em}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row img,.row .ph{width:2.2em;height:1.6em;object-fit:contain;border-radius:.25em;background:#0a1824;flex-shrink:0}
.row .fav{color:var(--accent)}
.row.sel{background:var(--panel2);box-shadow:inset -.2em 0 0 var(--accent)}
.moving{box-shadow:0 0 0 .2em var(--g)!important;background:#1d4a2c!important}
.prev{display:flex;flex-direction:column;gap:1.2vh;min-width:0}
.vbox{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:.8em;overflow:hidden}
.vbox video{width:100%;height:100%;display:block;background:#000}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:1em;font-size:.9em}
.info{background:var(--panel);border-radius:.8em;padding:1em 1.2em}
.info h3{margin:0 0 .3em;font-family:var(--display);font-size:1.1em}
.info p{margin:0;color:var(--mute);font-size:.85em;word-break:break-word}
.search{border:0;border-radius:.6em;background:var(--panel);padding:.7em .9em;width:100%}

/* favourites 4x4 */
.favgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:calc((100% - 3 * 1.6vh) / 4);gap:1.6vh 1.2vw;padding:.4em;scrollbar-width:none}
.fold{border:0;border-radius:.9em;background:linear-gradient(180deg,var(--sheet2),var(--sheet));display:flex;align-items:center;gap:.9em;padding:0 1.1em;cursor:pointer;text-align:start;min-width:0}
.fold:focus{background:linear-gradient(180deg,hsl(var(--h) 85% 66%),var(--sheet2));box-shadow:0 0 0 .18em var(--accent),0 .6em 1.6em rgba(0,0,0,.45)}
.fold .ic{width:2.6em;height:2em;flex-shrink:0;position:relative;border-radius:.3em;background:linear-gradient(180deg,#f6f8ff,#cfd8f3);display:grid;place-items:center;color:#e0447d;font-size:.95em}
.fold .ic::before{content:"";position:absolute;top:-.35em;inset-inline-start:0;width:1.1em;height:.5em;border-radius:.25em .25em 0 0;background:#c86be0}
.fold .tx{min-width:0;flex:1}
.fold .tx b{display:block;font-family:var(--display);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold .tx small{color:#d6e6ff;font-size:.75em}
.fold.add{background:transparent;border:.12em dashed var(--line);justify-content:center;color:var(--mute)}
.fold.add:focus{background:var(--panel2)}

/* grid (VOD) */
.vodwrap{flex:1;min-height:0;display:grid;grid-template-columns:22% 1fr;gap:1.2vw}
.grid{min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:1.2vw;align-content:start;padding:.4em;scrollbar-width:none}
.card{border:0;border-radius:.8em;background:var(--panel);padding:0;cursor:pointer;overflow:hidden;text-align:start}
.card .pst{aspect-ratio:2/3;background:#0a1824 center/cover no-repeat;display:grid;place-items:center;color:var(--line);font-family:var(--display);font-size:2em}
.card .ct{padding:.5em .7em;font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:focus{transform:scale(1.06)}

/* lists / forms */
.panel{max-width:62em;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:1.2vh;overflow:auto;padding:.4em}
.pl{display:grid;grid-template-columns:repeat(2,1fr);gap:1vw}
.pl .row{padding:1em 1.2em}
.pl .row.act{box-shadow:inset -.25em 0 0 var(--accent)}
.form{background:var(--panel);border-radius:1em;padding:1.4em;display:flex;flex-direction:column;gap:1em}
.form h2{margin:0;font-family:var(--display);font-size:1.2em}
.form label{display:flex;flex-direction:column;gap:.35em;color:var(--mute);font-size:.85em}
.form input,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:.6em;padding:.7em .9em;color:var(--fg);font:inherit;direction:ltr;text-align:left}
.form textarea{min-height:6em;resize:vertical}
.seg{display:flex;gap:.6em;flex-wrap:wrap}
.seg .btn.on{background:var(--panel2);box-shadow:inset 0 -.18em 0 var(--accent)}
.err{color:var(--danger);font-size:.9em;min-height:1.2em}

/* settings sheet (like the reference design) */
.sheetwrap{flex:1;min-height:0;display:grid;place-items:center}
.sheet{width:min(64em,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,hsl(var(--h) 70% 55%),hsl(var(--h) 62% 45%));border-radius:1.4em;padding:1.6em 2em 1.4em;box-shadow:0 1.5em 4em rgba(0,0,0,.5)}
.sheet h2{margin:0 0 1em;text-align:center;font-family:var(--display);font-size:1.4em}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1em 1.4em}
.sbtn{border:0;border-radius:.9em;background:rgba(255,255,255,.12);padding:1em 1.2em;display:flex;align-items:center;gap:.8em;cursor:pointer;text-align:start}
.sbtn:focus{background:rgba(255,255,255,.24);box-shadow:0 0 0 .15em var(--accent)}
.sbtn .si{width:1.8em;height:1.8em;border-radius:.45em;display:grid;place-items:center;background:linear-gradient(135deg,#f3f6ff,#c9d4f5);color:#3b4fa3;font-size:.9em;flex-shrink:0}
.slist{display:flex;flex-direction:column;gap:.8em}
.slist .sbtn{justify-content:space-between}
.slist .sbtn .v{color:#ffe08a;font-weight:600;display:inline-flex;align-items:center;gap:.5em}
.sgrid > :last-child:nth-child(odd){grid-column:1/-1}
.sw{display:inline-block;width:1.3em;height:1.3em;border-radius:50%;border:.12em solid rgba(255,255,255,.7)}
.pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1em}
.pk{border:.15em solid transparent;border-radius:.7em;padding:0;cursor:pointer;overflow:hidden;background:rgba(255,255,255,.1);display:flex;flex-direction:column}
.pk .th{aspect-ratio:2/1;width:100%;background-size:cover}
.pk span.l{padding:.35em .5em;font-size:.8em;text-align:center}
.pk.cur{border-color:#fff}
.pk:focus{box-shadow:0 0 0 .2em var(--accent);transform:scale(1.04)}
.pick.col .pk{flex-direction:row;align-items:center;gap:.7em;padding:.8em 1em}
.pick.col .pk .dot{width:1.8em;height:1.8em;border-radius:50%;flex-shrink:0;border:.12em solid rgba(255,255,255,.75)}
.pick.col .pk span.l{padding:0;font-size:.95em}
.sfoot{display:flex;justify-content:flex-start;margin-top:1.4em}
.sfoot .sbtn{padding:.8em 2em}
.sinfo{background:rgba(0,0,0,.15);border-radius:.9em;padding:1em 1.2em;line-height:1.9;font-size:.9em}

/* modal */
.modal{position:fixed;inset:0;z-index:70;background:rgba(3,9,15,.7);display:none;place-items:center;padding:4vh 4vw}
.modal.on{display:grid}
.mbox{width:min(30em,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:1.2em;padding:1.3em;display:flex;flex-direction:column;gap:.7em;box-shadow:0 2em 5em rgba(0,0,0,.6)}
.mbox h3{margin:0 0 .3em;font-family:var(--display);font-size:1.15em;text-align:center}
.mbox p{margin:0 0 .4em;color:var(--mute);text-align:center;font-size:.9em}
.mbox .row{justify-content:flex-start}
.mbox .row.danger .nm{color:var(--danger)}
.mbox input{border:1px solid var(--line);background:var(--bg);border-radius:.6em;padding:.8em 1em;color:var(--fg);font:inherit}
.mrow{display:flex;gap:.7em}
.mrow .btn{flex:1;justify-content:center}

/* fullscreen player */
.fs{position:fixed;inset:0;background:#000;z-index:50;display:none}
.fs.on{display:block}
.fs video{width:100%;height:100%;background:#000;object-fit:var(--fit,contain)}
.osd{position:absolute;inset-inline:3vw;bottom:4vh;background:rgba(7,18,28,.85);border-radius:1em;padding:1em 1.4em;display:flex;align-items:center;gap:1.2em;transition:opacity .3s}
.osd.hide{opacity:0}
.osd .n{font-family:var(--display);color:var(--accent);font-size:1.6em;font-variant-numeric:tabular-nums}
.osd h3{margin:0;font-family:var(--display)}
.osd p{margin:.2em 0 0;color:var(--mute);font-size:.85em}
.fsmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none;text-align:center;padding:2em}
.toast{position:fixed;bottom:5vh;left:50%;transform:translateX(-50%);background:var(--panel2);padding:.8em 1.4em;border-radius:.8em;z-index:80;box-shadow:0 .6em 2em rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
.empty{color:var(--mute);padding:2em;text-align:center;line-height:1.8}

@media (max-width:820px){
  body{overflow:auto;font-size:calc(15px * var(--fs))}
  .app{height:auto;min-height:100%;padding-inline:16px}
  .tiles{grid-template-columns:repeat(2,1fr);padding:2vh 0}
  .tile{height:24vh}
  .live,.vodwrap{grid-template-columns:1fr;grid-auto-rows:auto}
  .col{max-height:38vh}
  .pl,.sgrid{grid-template-columns:1fr}
  .pick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .favgrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:5em}
  .screen{min-height:70vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><i>▶</i><span>سالم بلاي</span></div>
    <div class="title" id="ttl">الرئيسية</div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <!-- HOME -->
  <section class="screen on" id="s-home">
    <div class="tiles">
      <button class="tile f" data-go="live"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><circle cx="19" cy="4" r="1.6"/></svg>قنوات مباشرة<small id="c-live">—</small></button>
      <button class="tile f" data-go="movies"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>أفلام<small id="c-movies">—</small></button>
      <button class="tile f" data-go="series"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M7 2l5 4 5-4M10 10l5 3-5 3z"/></svg>مسلسلات<small id="c-series">—</small></button>
      <button class="tile f" data-go="favs"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 16.5l-2.6-2.5a1.6 1.6 0 0 1 2.3-2.3l.3.3.3-.3a1.6 1.6 0 0 1 2.3 2.3z"/></svg>المفضلة<small id="c-favs">—</small></button>
    </div>
    <div class="homebar">
      <button class="btn f" data-go="recent">⟲ شوهد مؤخراً</button>
      <button class="btn f" data-go="playlists">📋 قوائم التشغيل</button>
      <button class="btn f" data-go="settings">⚙ الإعدادات</button>
      <button class="btn f" id="reload">⟳ تحديث القائمة</button>
    </div>
    <div class="meta" id="meta">لا توجد قائمة تشغيل بعد</div>
  </section>

  <!-- LIVE -->
  <section class="screen" id="s-live">
    <div class="live">
      <div class="col" id="groups"></div>
      <div class="col" id="chans"></div>
      <div class="prev">
        <div class="vbox"><video id="pv" muted playsinline></video><div class="vmsg" id="pvmsg">اختر قناة للمعاينة</div></div>
        <div class="info"><h3 id="pvname">—</h3><p id="pvgrp">اضغط OK مرة ثانية للتشغيل بملء الشاشة</p></div>
      </div>
    </div>
    <div class="hint"><span>⟵ عودة</span><span>OK تشغيل</span><span><kbd>ضغطة طويلة OK</kbd> خيارات القناة</span><span><b style="background:var(--r)"></b>مفضلة</span><span><b style="background:var(--g)"></b>بحث</span><span><b style="background:var(--b)"></b>خيارات</span></div>
  </section>

  <!-- FAVOURITES -->
  <section class="screen" id="s-favs">
    <div class="favgrid" id="favgrid"></div>
    <div class="hint"><span>⟵ عودة</span><span>OK فتح</span><span><kbd>ضغطة طويلة OK</kbd> حذف · نقل · إعادة تسمية</span><span><b style="background:var(--b)"></b>خيارات</span></div>
  </section>

  <!-- VOD GRID -->
  <section class="screen" id="s-vod">
    <div class="vodwrap">
      <div class="col" id="vgroups"></div>
      <div class="grid" id="vgrid"></div>
    </div>
    <div class="hint"><span>⟵ عودة</span><span>OK تشغيل</span><span><kbd>ضغطة طويلة OK</kbd> إضافة للمفضلة</span><span><b style="background:var(--g)"></b>بحث</span></div>
  </section>

  <!-- SERIES EPISODES -->
  <section class="screen" id="s-eps">
    <div class="vodwrap">
      <div class="col" id="seasons"></div>
      <div class="col" id="eps"></div>
    </div>
  </section>

  <!-- PLAYLISTS -->
  <section class="screen" id="s-playlists">
    <div class="panel">
      <div class="pl" id="pllist"></div>
      <div class="form">
        <h2>إضافة قائمة تشغيل</h2>
        <div class="seg" id="ptype">
          <button class="btn f on" data-t="m3u">رابط M3U</button>
          <button class="btn f" data-t="xtream">Xtream Codes</button>
          <button class="btn f" data-t="file">ملف / نص</button>
        </div>
        <label>اسم القائمة<input class="f" id="pname" placeholder="مثال: البيت" style="direction:rtl;text-align:right"></label>
        <div id="f-m3u"><label>رابط القائمة<input class="f" id="purl" placeholder="http://example.com/get.php?username=...&type=m3u_plus"></label></div>
        <div id="f-xtream" hidden>
          <label>رابط السيرفر<input class="f" id="xsrv" placeholder="http://server.com:8080"></label>
          <label>اسم المستخدم<input class="f" id="xusr"></label>
          <label>كلمة المرور<input class="f" id="xpwd"></label>
        </div>
        <div id="f-file" hidden>
          <label>ارفع ملف .m3u<input class="f" type="file" id="pfile" accept=".m3u,.m3u8,.txt"></label>
          <label>أو الصق محتوى القائمة<textarea class="f" id="ptext" placeholder="#EXTM3U"></textarea></label>
        </div>
        <div class="err" id="perr"></div>
        <div><button class="btn pri f" id="padd">إضافة وتحميل</button></div>
      </div>
    </div>
  </section>

  <!-- SETTINGS (main sheet) -->
  <section class="screen" id="s-settings">
    <div class="sheetwrap">
      <div class="sheet">
        <h2>الإعدادات</h2>
        <div class="sgrid">
          <button class="sbtn f" data-set="general"><span class="si">✿</span>الإعدادات العامة</button>
          <button class="sbtn f" data-set="look"><span class="si">🎨</span>الخلفية والألوان</button>
          <button class="sbtn f" data-set="player"><span class="si">▶</span>إعدادات مشغل الفيديو</button>
          <button class="sbtn f" data-set="parental"><span class="si">🔒</span>الرقابة الأبوية</button>
          <button class="sbtn f" data-set="info"><span class="si">ℹ</span>معلومات النظام</button>
          <button class="sbtn f" data-set="data"><span class="si">🗑</span>إدارة البيانات</button>
          <button class="sbtn f" data-go="playlists"><span class="si">☰</span>قائمة التشغيل</button>
        </div>
        <div class="sfoot"><button class="sbtn f" data-close>إغلاق</button></div>
      </div>
    </div>
  </section>

  <!-- PICKER (backgrounds / colours) -->
  <section class="screen" id="s-pick">
    <div class="sheetwrap">
      <div class="sheet">
        <h2 id="picktitle"></h2>
        <div class="pick" id="pickgrid"></div>
        <div class="sfoot"><button class="sbtn f" data-close>إغلاق</button></div>
      </div>
    </div>
  </section>

  <!-- SETTINGS (sub page) -->
  <section class="screen" id="s-setsub">
    <div class="sheetwrap">
      <div class="sheet">
        <h2 id="settitle"></h2>
        <div class="slist" id="setlist"></div>
        <div class="sfoot"><button class="sbtn f" data-close>إغلاق</button></div>
      </div>

/* ---------- parsing ---------- */
function parseM3U(txt){
  const out={live:{},movies:{},series:{}};let cur=null;
  for(const raw of txt.split(/\r?\n/)){const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){const attr=k=>{const m=l.match(new RegExp(k+'="([^"]*)"'));return m?m[1]:''};
      cur={name:l.slice(l.lastIndexOf(',')+1).trim()||attr('tvg-name')||'بدون اسم',logo:attr('tvg-logo'),group:attr('group-title')||'عام'};}
    else if(!l.startsWith('#')&&cur){cur.url=l;
      const kind=/\/movie\//i.test(l)?'movies':/\/series\//i.test(l)?'series':'live';
      (out[kind][cur.group]??=[]).push(cur);cur=null;}}
  const toArr=o=>Object.entries(o).map(([name,items])=>({name,items}));
  return {live:toArr(out.live),movies:toArr(out.movies),series:toArr(out.series)};
}
async function getText(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function loadXtream(p){
  const base=p.server.replace(/\/+$/,''), q=`${base}/player_api.php?username=${encodeURIComponent(p.user)}&password=${encodeURIComponent(p.pass)}`;
  const info=await getJSON(q);
  if(!info||!info.user_info||info.user_info.auth==0)throw new Error('بيانات الدخول غير صحيحة');
  p.exp=info.user_info.exp_date?new Date(info.user_info.exp_date*1000).toLocaleDateString('ar-OM'):'غير محدد';
  const [lc,ls,vc,vs,sc,ss]=await Promise.all(['get_live_categories','get_live_streams','get_vod_categories','get_vod_streams','get_series_categories','get_series'].map(a=>getJSON(`${q}&action=${a}`).catch(()=>[])));
  const group=(cats,items,mk)=>{const m=new Map((cats||[]).map(c=>[String(c.category_id),{name:c.category_name,items:[]}]));const other={name:'أخرى',items:[]};
    (items||[]).forEach(it=>{const g=m.get(String(it.category_id))||other;const x=mk(it);x.group=g.name;g.items.push(x)});return [...m.values(),other].filter(g=>g.items.length)};
  const u=encodeURIComponent(p.user),pw=encodeURIComponent(p.pass);
  return {
    live:group(lc,ls,it=>({name:it.name,logo:it.stream_icon,num:it.num,url:`${base}/live/${u}/${pw}/${it.stream_id}.m3u8`})),
    movies:group(vc,vs,it=>({name:it.name,logo:it.stream_icon,url:`${base}/movie/${u}/${pw}/${it.stream_id}.${it.container_extension||'mp4'}`})),
    series:group(sc,ss,it=>({name:it.name,logo:it.cover,seriesId:it.series_id,url:'series:'+it.series_id,xt:{base,u,pw,q}})),
  };
}
async function loadPlaylist(p){
  if(p.type==='xtream')return loadXtream(p);

  return parseM3U(txt);
}

/* spatial navigation */
function visibleF(){
  if(modalOpen())return $$('#mbox .f');
  if($('#fs').classList.contains('on'))return [];
  const scope='.f';
  return $$(scope).filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&e.offsetParent!==null})}
function move(dir){
  const cur=document.activeElement;const all=visibleF();
  if(!cur||!all.includes(cur)){all[0]&&all[0].focus();return}
  const a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;let best=null,bs=1e9;
  for(const e of all){if(e===cur)continue;const b=e.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2,dx=bx-ax,dy=by-ay;
    let ok=false,main=0,side=0;
    if(dir==='left'){ok=b.right<=a.left+4;main=-dx;side=Math.abs(dy)}
    if(dir==='right'){ok=b.left>=a.right-4;main=dx;side=Math.abs(dy)}
    if(dir==='up'){ok=b.bottom<=a.top+4;main=-dy;side=Math.abs(dx)}
    if(dir==='down'){ok=b.top>=a.bottom-4;main=dy;side=Math.abs(dx)}
    if(!ok)continue;
    const sameCol=e.parentElement===cur.parentElement?0:400;
    const score=main+side*2+((dir==='up'||dir==='down')?sameCol:0);
    if(score<bs){bs=score;best=e}}
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}
}

/* ---------- player ---------- */
function fixUrl(url){
  const m=url.match(/^(https?:\/\/[^\/]+)\/(?:live\/)?([^\/]+)\/([^\/]+)\/(\d+)(?:\.ts)?$/i);
  return m?`${m[1]}/live/${m[2]}/${m[3]}/${m[4]}.m3u8`:url;
}
const BUF={low:10,normal:30,high:60};
function attach(video,url,ref){
  url=fixUrl(url);
  if(ref.h){ref.h.destroy();ref.h=null}
  video.removeAttribute('src');
  const useHls=settings.engine==='hls'&&/\.m3u8(\?|$)/i.test(url)&&window.Hls&&Hls.isSupported();
  if(useHls){const b=BUF[settings.buffer]||30;const h=new Hls({maxBufferLength:b,maxMaxBufferLength:b*2});h.loadSource(url);h.attachMedia(video);ref.h=h;
    h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)video.dispatchEvent(new Event('error'))});}
  else video.src=url;
  return video.play().catch(()=>{});
}
const pvRef={h:null},fsRef={h:null};let pvTimer=null;
function preview(c){
  if(!c)return;
  $('#pvname').textContent=dn(c);$('#pvgrp').textContent=(c.group||'')+' · اضغط OK مرة ثانية للتشغيل بملء الشاشة';
  if(!settings.preview){$('#pvmsg').hidden=false;$('#pvmsg').textContent='المعاينة متوقفة من الإعدادات';return}
  clearTimeout(pvTimer);$('#pvmsg').textContent='جاري التحميل…';$('#pvmsg').hidden=false;
  pvTimer=setTimeout(()=>attach($('#pv'),c.url,pvRef),450);
}
$('#pv').addEventListener('playing',()=>$('#pvmsg').hidden=true);
$('#pv').addEventListener('error',()=>{$('#pvmsg').hidden=false;$('#pvmsg').textContent='تعذّر تشغيل القناة'});
function stopPreview(){clearTimeout(pvTimer);if(pvRef.h){pvRef.h.destroy();pvRef.h=null}const v=$('#pv');v.pause();v.removeAttribute('src');v.load()}

function setAction(id){
  const S=settings;
  const r=({ 'g-fs':()=>S.fs=cyc(FS,S.fs),'g-time':()=>S.h24=!S.h24,'g-prev':()=>S.preview=!S.preview,
    'p-eng':()=>S.engine=cyc(ENG,S.engine),'p-fit':()=>S.fit=cyc(FIT,S.fit),'p-buf':()=>S.buffer=cyc(BUFL,S.buffer),'p-rec':()=>S.reconnect=!S.reconnect,
    'k-adult':()=>{S.adult=!S.adult;setTimeout(refresh,50)},
    'd-hidden':()=>{hidden=[];store.set('hidden',hidden);toast('ظهرت كل القنوات')},
    'd-renames':()=>{renames={};store.set('renames',renames);toast('رجعت الأسماء الأصلية')},
    'd-orders':()=>{orders={};store.set('orders',orders);toast('رجع الترتيب الأصلي');setTimeout(refresh,50)},
    'd-recent':()=>{recent=[];store.set('recent',recent);toast('تم المسح')},
    'l-bg':()=>{show('pick',true,'الإعدادات','bg');return 'nav'},'l-hue':()=>{show('pick',true,'الإعدادات','hue');return 'nav'},
    'l-fg':()=>{show('pick',true,'الإعدادات','fg');return 'nav'},'l-acc':()=>{show('pick',true,'الإعدادات','acc');return 'nav'},
    'l-img':()=>{$('#bgfile').click();return 'nav'},
    'l-reset':()=>{Object.assign(S,{bg:0,hue:212,fg:'#e8f1f7',accent:'#f2b544'});toast('رجع المظهر الافتراضي')} }[id]||(()=>{}))();
  if(r==='nav')return;
  applySettings();renderSetSub(setPage,id);
}

/* picker screen */
let pickKind='bg';
function renderPick(kind,focusVal){pickKind=kind||pickKind;const G=$('#pickgrid');let html='',title='';
  if(pickKind==='bg'){title='خلفية';G.className='pick';
    html=BGS.map((b,i)=>`<button class="pk f ${settings.bg===i?'cur':''}" data-pk="${i}"><span class="th" style="background:${bgCss(i,settings.hue).replace(/"/g,"'")}"></span><span class="l">${b[0]}</span></button>`).join('')+
      (bgImg?`<button class="pk f ${settings.bg==='img'?'cur':''}" data-pk="img"><span class="th" style="background:${bgCss('img').replace(/"/g,"'")}"></span><span class="l">صورتي</span></button>`:'');}
  else{G.className='pick col';const arr=pickKind==='hue'?HUES:pickKind==='fg'?FGS:ACCS;const cur=pickKind==='hue'?settings.hue:pickKind==='fg'?settings.fg:settings.accent;
    title=pickKind==='hue'?'لون الخلفية والإطارات':pickKind==='fg'?'لون الخط':'لون التمييز';
    html=arr.map(([v,n])=>`<button class="pk f ${v===cur?'cur':''}" data-pk="${v}"><span class="dot" style="background:${pickKind==='hue'?`hsl(${v},70%,50%)`:v}"></span><span class="l">${n}</span></button>`).join('');}
  $('#picktitle').textContent=title;G.innerHTML=html;
  const fv=focusVal!=null?focusVal:(pickKind==='bg'?settings.bg:pickKind==='hue'?settings.hue:pickKind==='fg'?settings.fg:settings.accent);
  if(!focusFirst(`#pickgrid [data-pk="${fv}"]`))focusFirst('#pickgrid .pk');
}
function setPick(v){
  if(pickKind==='bg')settings.bg=v==='img'?'img':+v;
  else if(pickKind==='hue')settings.hue=+v;
  else if(pickKind==='fg')settings.fg=v;else settings.accent=v;
  applySettings();renderPick(pickKind,v);
}
$('#bgfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const W=1920,H=1080,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
      const sc=Math.max(W/im.width,H/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
      try{bgImg=c.toDataURL('image/jpeg',.8);store.set('bgimg',bgImg);settings.bg='img';applySettings();toast('تم تعيين الصورة كخلفية');
        if(screen==='setsub')renderSetSub('look','l-img')}catch(err){toast('تعذّر حفظ الصورة')}};
    im.onerror=()=>toast('الملف ليس صورة');im.src=rd.result};
  rd.readAsDataURL(f);e.target.value=''});

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.mi!==undefined){const fn=menuFns[+t.dataset.mi];fn&&fn();return}
  if(moveState){endMove(true);return}
  if(t.dataset.go)return show(t.dataset.go);
  if(t.dataset.close!==undefined)return back();
  if(t.dataset.set)return show('setsub',true,'الإعدادات',t.dataset.set);
  if(t.closest('#setlist')&&t.id)return setAction(t.id);
  if(t.dataset.pk!==undefined)return setPick(t.dataset.pk);
  if(t.id==='reload'){refresh().then(()=>toast('تم التحديث'));return}
  if(t.dataset.allfav!==undefined)return show('folder',true,'كل المفضلة','__all');
  if(t.dataset.fold!==undefined){const f=folders[+t.dataset.fold];return show('folder',true,f.name,f.id)}
  if(t.dataset.newfold!==undefined)return newFolder();
  if(t.dataset.g!==undefined)return selectGroup(+t.dataset.g);
  if(t.dataset.c!==undefined){const i=+t.dataset.c,c=liveState.list[i];
    if(liveState.idx===i&&settings.preview)return playFs(c,liveState.list,i);
    liveState.idx=i;preview(c);if(!settings.preview)playFs(c,liveState.list,i);return}
  if(t.dataset.vg!==undefined)return selectVod(+t.dataset.vg);
  if(t.dataset.v!==undefined){const m=vodState.list[+t.dataset.v];return vodState.kind==='series'?openSeries(m):playFs(m,vodState.list,+t.dataset.v)}
  if(t.dataset.sea!==undefined){$('#seasons')._show(t.dataset.sea);return}
  if(t.dataset.ep!==undefined){const l=$('#eps')._list;return playFs(l[+t.dataset.ep],l,+t.dataset.ep)}
  if(t.dataset.pl){if(t.dataset.pl==='demo')return;activeId=t.dataset.pl;store.set('active',activeId);refresh().then(renderPlaylists);toast('تم اختيار القائمة');return}
});
document.addEventListener('focusin',e=>{const t=e.target;
  if(t.dataset&&t.dataset.c!==undefined&&settings.preview&&!moveState){const i=+t.dataset.c;liveState.idx=i;preview(liveState.list[i])}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#fs').addEventListener('click',()=>showOsd());

/* long press = options */
function longPress(el){
  if(!el||!el.dataset)return;
  if(el.dataset.c!==undefined)return chanMenu(+el.dataset.c);
  if(el.dataset.fold!==undefined)return folderMenu(+el.dataset.fold);
  if(el.dataset.v!==undefined){const m=vodState.list[+el.dataset.v];return m&&pickFolder({...m,kind:vodState.kind})}
  if(el.dataset.pl)return playlistMenu(el.dataset.pl);
  el.click();
}
document.addEventListener('contextmenu',e=>{const t=e.target.closest('button');if(t&&!modalOpen()){e.preventDefault();t.focus();longPress(t)}});

/* ---------- remote keys ---------- */
const K={37:'left',38:'up',39:'right',40:'down',13:'ok',23:'ok',8:'back',27:'back',10009:'back',461:'back',403:'red',404:'green',405:'yellow',406:'blue',427:'chup',428:'chdown',33:'chup',34:'chdown',93:'menu',82:'menu'};
const KN={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'ok',Escape:'back',GoBack:'back',BrowserBack:'back',ColorF0Red:'red',ColorF1Green:'green',ColorF2Yellow:'yellow',ColorF3Blue:'blue',ChannelUp:'chup',ChannelDown:'chdown',ContextMenu:'menu'};
let okTimer=null,okLong=false,okDown=false;
document.addEventListener('keydown',e=>{
  const k=K[e.keyCode]||KN[e.key];if(!k)return;
  const ae=document.activeElement,typing=['INPUT','TEXTAREA'].includes(ae.tagName);
  if(typing&&ae.type!=='file'){
    if(k==='left'||k==='right'||(k==='back'&&e.keyCode===8))return;
    if(k==='ok'){e.preventDefault();if(ae.id==='mtext'){$('#mok').click();return}move('down');return}
  }
  const fsOn=$('#fs').classList.contains('on');
  if(k==='ok'){e.preventDefault();
    if(okDown)return;okDown=true;okLong=false;
    okTimer=setTimeout(()=>{okLong=true;
      if(fsOn){const c=fsList[fsIdx];c&&pickFolder(c);return}
      if(!modalOpen()&&!moveState)longPress(document.activeElement)},650);
    return}
  if(fsOn&&!modalOpen()){e.preventDefault();
    if(k==='back')closeFs();else if(k==='up'||k==='chup')zap(-1);else if(k==='down'||k==='chdown')zap(1);
    else if(k==='red'||k==='blue'||k==='menu'){const c=fsList[fsIdx];c&&pickFolder(c)}else showOsd();return}
  if(k==='back'){e.preventDefault();return back()}
  if(moveState&&['left','right','up','down'].includes(k)){e.preventDefault();return moveStep(k)}
  if(['left','right','up','down'].includes(k)){e.preventDefault();return move(k)}
  if(modalOpen())return;
  if(k==='blue'||k==='menu'){e.preventDefault();return longPress(ae)}
  if(k==='red'){
    if(ae.dataset.c!==undefined){const c=liveState.list[+ae.dataset.c];return c&&pickFolder(c)}
    if(ae.dataset.v!==undefined){const m=vodState.list[+ae.dataset.v];return m&&pickFolder(m)}
    return}
  if(k==='green'&&['live','recent','folder','movies','series'].includes(screen))return openSearch();
  if(k==='yellow'&&screen==='live')return selectGroup(0);
  if((k==='chup'||k==='chdown')&&['live','recent','folder'].includes(screen))move(k==='chup'?'up':'down');
});
document.addEventListener('keyup',e=>{
  const k=K[e.keyCode]||KN[e.key];if(k!=='ok'||!okDown)return;
  okDown=false;clearTimeout(okTimer);
  if(okLong)return;
  const ae=document.activeElement;
  if(['INPUT','TEXTAREA'].includes(ae.tagName)&&ae.type!=='file')return;
  if($('#fs').classList.contains('on')&&!modalOpen()){showOsd();return}
  if(moveState){endMove(true);return}
  if(ae&&ae.tagName==='BUTTON')ae.click();
  else if(ae&&ae.type==='file')ae.click();
});

// Android TV back button hook: returns true if handled inside the app
window.spBack=()=>{if(modalOpen()||moveState||$('#fs').classList.contains('on')||stack.length){back();return true}return false};

applySettings();
refresh().then(()=>focusFirst('#s-home .tile'));
})();
</script>
